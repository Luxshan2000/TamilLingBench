  tgt_lang: tam_Taml
  max_position_embeddings: 1024
  arm: nmt
  notes: No prompt. Exempt from the prompt-robustness run.
- id: indictrans2-1b
  hf_name: ai4bharat/indictrans2-en-indic-1B
  backend: indictrans2
  dtype: float16
  src_lang: eng_Latn
  tgt_lang: tam_Taml
  arm: nmt
  notes: ⚠ IndicTransToolkit 1.1.x does NOT import under transformers 5.12.1 (`cannot import name 'PreTrainedTokenizerBase'
    from 'transformers.tokenization_utils'`). The fallback is a separate venv pinned
    to transformers<5; see scripts/eval/setup_it2_venv.sh. Do not run this backend from the main venv.
